name: Deploy to GitHub Pages

# Tests the app, then publishes web/ to the gh-pages branch, which GitHub Pages serves
# at https://siggiebahamas.github.io/PermitPal/ (same setup as Buzz).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tests/ui/smoke.mjs
        env:
          CHROMIUM: ""
      - run: node scripts/build-demo.mjs
      - run: touch web/.nojekyll && cp web/index.html web/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
