name: Keep the database awake

# Supabase's free plan pauses a project after 7 days without traffic. One tiny read every
# two days prevents that during the pilot. Safe to delete once on the Pro plan.
on:
  schedule:
    - cron: "17 2 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -sS -o out.txt -w "%{http_code}" -X POST \
            "https://zeaiwvgktakbwnqpchbo.supabase.co/rest/v1/rpc/health" \
            -H "apikey: sb_publishable_Mjq5bLuJ8fX_dmIik_3VIg_oM_8MzNb" -H "Content-Type: application/json" -d '{}')
          cat out.txt; echo; test "$code" = "200"
